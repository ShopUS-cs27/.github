name: Reusable — Secrets scan

# Scan Gitleaks de l'historique complet. Appelable depuis n'importe quel
# dépôt de l'org :
#   jobs:
#     secrets:
#       uses: ShopUS-cs27/.github/.github/workflows/secrets-scan.yml@main
#
# Config : si le dépôt appelant contient un `.gitleaks.toml` à sa racine,
# il est utilisé (allowlist spécifique au projet). Sinon, une config de
# base est générée : règles Gitleaks par défaut + allowlist des fichiers
# de test/spec/fixtures (credentials factices volontaires).

on:
  workflow_call:

jobs:
  gitleaks:
    name: Secrets scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Binaire OSS — gitleaks-action exige une license pour les orgs.
      # Version épinglée pour la reproductibilité.
      - name: Installer Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            | tar -xz gitleaks
      - name: Configurer l'allowlist
        run: |
          set -e
          if [ -f .gitleaks.toml ]; then
            echo "Utilisation du .gitleaks.toml du dépôt"
            echo "CONFIG_ARGS=--config .gitleaks.toml" >> "$GITHUB_ENV"
          else
            {
              echo 'title = "ShopUs — config CI de base"'
              echo ''
              echo '[extend]'
              echo 'useDefault = true'
              echo ''
              echo '[allowlist]'
              echo 'description = "Fichiers de test et fixtures : credentials factices volontaires"'
              echo 'paths = ['
              echo "  '''.*\\.spec\\.[a-z]+$''',"
              echo "  '''.*\\.test\\.[a-z]+$''',"
              echo "  '''(^|/)tests?/.*''',"
              echo "  '''(^|/)e2e/.*''',"
              echo "  '''(^|/)fixtures/.*''',"
              echo "  '''(^|/)__mocks__/.*''',"
              echo "  '''(^|/)testdata/.*''',"
              echo ']'
            } > .gitleaks.ci.toml
            echo "CONFIG_ARGS=--config .gitleaks.ci.toml" >> "$GITHUB_ENV"
          fi
      - name: Scan des secrets (historique complet)
        run: ./gitleaks git --redact --verbose --exit-code 1 $CONFIG_ARGS .
