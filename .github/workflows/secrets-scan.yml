name: Reusable — Secrets scan

# Scan Gitleaks de l'historique complet. Appelable depuis n'importe quel
# dépôt de l'org :
#   jobs:
#     secrets:
#       uses: ShopUS-cs27/.github/.github/workflows/secrets-scan.yml@main

on:
  workflow_call:
    secrets: {}

jobs:
  gitleaks:
    name: Secrets scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Binaire OSS — gitleaks-action exige une license pour les orgs.
      # Version épinglée pour la reproductibilité.
      - name: Installer Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            | tar -xz gitleaks
      - name: Scan des secrets (historique complet)
        run: ./gitleaks git --redact --verbose --exit-code 1 .
