name: Reusable — PR guardrails

# Garde-fous déterministes sur les pull requests (aucune IA, zéro coût) :
#   1. Template PR rempli : carte Trello + exigences EF/RG/ENF
#   2. Fichiers interdits : .env, clés, credentials, google-services.json
#   3. Taille de diff : avertissement au-delà de 800 lignes modifiées
#
# Usage dans un dépôt appelant :
#   jobs:
#     guardrails:
#       uses: ShopUS-cs27/.github/.github/workflows/pr-guardrails.yml@main

on:
  workflow_call:

jobs:
  guardrails:
    name: PR guardrails
    # Uniquement sur pull_request : pas de payload PR sur les push.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Vérifier le template et les fichiers de la PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          FAIL=0
          WARNINGS=""
          REASONS=""

          # PR de promotion dev → main : pas de template feature requis,
          # le diff est gros par nature. On garde quand même le scan
          # des fichiers interdits.
          IS_RELEASE=0
          if [ "${{ github.event.pull_request.head.ref }}" = "dev" ] && \
             [ "${{ github.event.pull_request.base.ref }}" = "main" ]; then
            IS_RELEASE=1
            echo "PR de release (dev → main) — template et taille non applicables."
          fi

          # --- 1. Template PR : Trello + exigences renseignés ---
          if [ "$IS_RELEASE" -eq 0 ]; then
          trello_line=$(printf '%s' "$PR_BODY" | grep -i '^- Trello' | head -1 || true)
          req_line=$(printf '%s' "$PR_BODY" | grep -i '^- Exigences' | head -1 || true)

          trello_val=$(printf '%s' "$trello_line" | sed 's/^- *Trello *://I' | tr -d '[:space:]')
          req_val=$(printf '%s' "$req_line" | sed 's/^- *Exigences *://I' | tr -d '[:space:]')

          if [ -z "$trello_val" ] || [ -z "$req_val" ]; then
            echo "::error::Template PR incomplet — renseigner '- Trello :' (lien/carte) et '- Exigences :' (EF/RG/ENF)."
            REASONS="${REASONS}- Template PR incomplet : renseigner \`- Trello :\` et \`- Exigences :\`.\n"
            FAIL=1
          else
            echo "OK — Trello et exigences renseignés."
          fi
          fi # fin IS_RELEASE == 0

          # Cases de la checklist DoD restées décochées = avertissement (pas bloquant)
          if [ "$IS_RELEASE" -eq 0 ]; then
          unchecked=$(printf '%s' "$PR_BODY" | grep -c '^- \[ \]' || true)
          if [ "$unchecked" -gt 0 ]; then
            WARNINGS="${WARNINGS}- ${unchecked} case(s) de la checklist DoD non cochée(s).\n"
          fi
          fi # fin IS_RELEASE == 0

          # --- 2. Fichiers interdits dans le diff ---
          files=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')

          forbidden=$(printf '%s\n' "$files" | grep -Ei '(^|/)\.env($|\.)|\.pem$|\.key$|google-services\.json|GoogleService-Info\.plist|id_rsa|credentials\.json|service-account.*\.json' || true)
          if [ -n "$forbidden" ]; then
            echo "::error::Fichiers sensibles détectés dans la PR :"
            printf '%s\n' "$forbidden" | sed 's/^/  - /'
            REASONS="${REASONS}- Fichier(s) sensible(s) interdit(s) :\n$(printf '%s\n' "$forbidden" | sed 's/^/  - /')\n"
            FAIL=1
          fi

          # --- 3. Taille du diff ---
          stats=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '{additions, deletions, changed_files}')
          additions=$(printf '%s' "$stats" | python3 -c "import json,sys; print(json.load(sys.stdin)['additions'])")
          deletions=$(printf '%s' "$stats" | python3 -c "import json,sys; print(json.load(sys.stdin)['deletions'])")
          changed=$(printf '%s' "$stats" | python3 -c "import json,sys; print(json.load(sys.stdin)['changed_files'])")
          total=$((additions + deletions))

          echo "Diff : ${additions}+ / ${deletions}- dans ${changed} fichier(s)."
          if [ "$total" -gt 800 ] && [ "$IS_RELEASE" -eq 0 ]; then
            WARNINGS="${WARNINGS}- Diff volumineux (${total} lignes) : envisager de découper la PR.\n"
          fi

          # --- Publication des avertissements en commentaire PR ---
          # Déduplication : on supprime nos anciens commentaires de
          # garde-fous puis on en poste un seul à jour.
          if [ -n "$WARNINGS" ]; then
            marker="<!-- guardrails-warnings -->"
            old_ids=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("guardrails-warnings"))) | .id' || true)
            for id in $old_ids; do
              gh api -X DELETE "repos/${REPO}/issues/comments/${id}" || true
            done
            body=$(printf "## Garde-fous PR — avertissements\n\n${marker}\n\n> Checks déterministes (pas d'IA). Ceci **n'apparaît que si quelque chose cloche** — le silence = tout est conforme.\n\n${WARNINGS}\n**Action attendue** : corriger les points ci-dessus ou justifier dans la PR.")
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$body" || true
          fi

          if [ "$FAIL" -eq 1 ]; then
            # Commentaire explicite sur la PR pour guider le dev.
            marker_fail="<!-- guardrails-fail -->"
            old_fail=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("guardrails-fail"))) | .id' || true)
            for id in $old_fail; do
              gh api -X DELETE "repos/${REPO}/issues/comments/${id}" || true
            done
            fbody=$(printf "## Garde-fous PR — ÉCHEC\n\n${marker_fail}\n\n${REASONS}\nConsulter le run CI pour le détail. Corriger puis repousser : le check se relancera automatiquement.")
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$fbody" || true
            echo "Garde-fous : ÉCHEC"
            exit 1
          fi
          echo "Garde-fous : OK"
