name: Reusable — AI PR review

# Review automatique des PR par PR-Agent (Qodo Merge, open source, v0.50.0).
# Le bot commente chaque PR avec une revue senior : résumé, problèmes
# potentiels, conformité aux conventions du projet.
#
# La configuration (modèle, règles de revue, déclencheurs) vit dans le
# fichier `.pr_agent.toml` à la racine de la branche par défaut de chaque
# dépôt — c'est le mécanisme officiel, prioritaire sur les variables
# d'environnement.
#
# Prérequis : secret `GEMINI_API_KEY` (clé gratuite Google AI Studio)
# dans le dépôt appelant. Sans la clé, le job se termine en 'notice'.
#
# Usage :
#   jobs:
#     ai-review:
#       uses: ShopUS-cs27/.github/.github/workflows/ai-review.yml@main
#       secrets:
#         GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

on:
  workflow_call:
    # Secret optionnel : le job affiche une notice si la clé est absente.
    secrets:
      GEMINI_API_KEY:
        required: false

jobs:
  ai-review:
    name: AI review (PR-Agent)
    # Uniquement sur pull_request : pas de payload PR sur les push.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Vérifier la clé LLM
        id: check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GEMINI_API_KEY absente — review IA désactivée. Ajouter le secret au dépôt pour l'activer."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: PR-Agent review
        if: steps.check.outputs.present == 'true'
        uses: the-pr-agent/pr-agent@v0.50.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR-Agent exige une clé sous OPENAI_API_KEY pour démarrer ;
          # le modèle réel (gemini/*) est routé via GEMINI_API_KEY.
          OPENAI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
