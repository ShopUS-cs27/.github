name: Reusable — Security review (IA)

# Review AppSec dédiée par IA (Gemini) — distincte de la review
# fonctionnelle PR-Agent. Consultative : publie un commentaire
# verdict/sévérité, ne bloque jamais le merge.
#
# Prérequis : secret GEMINI_API_KEY dans le dépôt appelant.
# La logique vit dans scripts/security_review.py du dépôt .github.
#
# Usage :
#   jobs:
#     security-review:
#       uses: ShopUS-cs27/.github/.github/workflows/security-review.yml@main
#       secrets:
#         GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

on:
  workflow_call:
    secrets:
      GEMINI_API_KEY:
        required: false

jobs:
  security-review:
    name: Security review (IA)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout des scripts plateforme
        uses: actions/checkout@v4
        with:
          repository: ShopUS-cs27/.github
          path: platform
      - name: Review sécurité du diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 platform/scripts/security_review.py
