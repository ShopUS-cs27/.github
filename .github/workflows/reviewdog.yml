name: Reusable — ESLint via reviewdog

# Publie les warnings/erreurs ESLint en commentaires de review sur les
# lignes du diff (filtre "added" : seules les nouvelles lignes comptent).
# Sans config ESLint ou sans package.json → job ignoré proprement.
#
# Usage :
#   jobs:
#     lint-review:
#       uses: ShopUS-cs27/.github/.github/workflows/reviewdog.yml@main

on:
  workflow_call:

jobs:
  eslint:
    name: ESLint → reviewdog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: ESLint configuré ?
        id: check
        run: |
          if [ -f package.json ] && ls eslint.config.* .eslintrc* >/dev/null 2>&1; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Pas de config ESLint — job ignoré."
          fi

      - if: steps.check.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - if: steps.check.outputs.run == 'true'
        run: npm ci

      - if: steps.check.outputs.run == 'true'
        uses: reviewdog/action-eslint@6dad10dc50476699ad1ddbbb19bf55d36f311a39 # v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          filter_mode: added
          fail_level: none
          eslint_flags: 'src/ test/'
