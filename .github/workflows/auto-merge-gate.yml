name: Reusable — Auto-merge gate

# Merge automatique conditionnel (squash) — voir scripts/auto_merge_gate.py
# pour les règles exactes : approbation humaine + CI verte + hors zones
# sensibles. Zones sensibles = merge manuel toujours.
#
# Déclencheurs côté appelant (workflow séparé, pas un job de ci.yml) :
#   on:
#     pull_request_review: { types: [submitted] }
#     workflow_run: { workflows: ["CI"], types: [completed] }
#   jobs:
#     gate:
#       uses: ShopUS-cs27/.github/.github/workflows/auto-merge-gate.yml@main

on:
  workflow_call:

jobs:
  gate:
    name: Auto-merge gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout des scripts plateforme
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ShopUS-cs27/.github
          path: platform
      - name: Évaluer les conditions de merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: python3 platform/scripts/auto_merge_gate.py
